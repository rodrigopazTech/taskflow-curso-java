# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
# Nombre identificador de la aplicación en el ecosistema Spring
spring.application.name=taskflow

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (H2)
# ===================================================================
# URL de conexión: Guarda los datos en disco en la carpeta local './data/taskflow'
# para que la información no se pierda al reiniciar la aplicación (modo persistente en archivo)
spring.datasource.url=jdbc:h2:file:./data/taskflow

# Driver JDBC necesario para comunicarse con el motor de base de datos H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuario por defecto para conectarse a la base de datos ('sa' = System Administrator)
spring.datasource.username=sa

# Contraseña del usuario (en este caso vacía para entorno de desarrollo local)
spring.datasource.password=

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Estrategia de generación/actualización del esquema de base de datos:
# 'update': Hibernate compara las entidades (@Entity) con las tablas existentes
# y crea o actualiza las columnas automáticamente sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# CONSOLA WEB DE H2 (INTERFAZ GRÁFICA EN EL NAVEGADOR)
# ===================================================================
# Habilita la consola web visual de H2 para consultar y administrar las tablas desde el navegador
spring.h2.console.enabled=true

# Ruta o endpoint donde estará disponible la consola (por defecto: http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console
